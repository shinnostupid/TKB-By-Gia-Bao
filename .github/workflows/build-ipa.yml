name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -switch /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj

      - name: Compile iOS App Bundle (Diagnostic)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee xcode_output.txt || true

          echo "==================== XCODEBUILD ERROR SUMMARY ===================="
          grep -E "(error:|fatal error:|BUILD FAILED)" xcode_output.txt -B 2 -A 4 || true
          echo "==================== LAST 50 LINES OF LOG ===================="
          tail -n 50 xcode_output.txt

          if grep -q "BUILD FAILED" xcode_output.txt; then
            echo "Build failed!"
            exit 1
          fi

      - name: Package Payload into .ipa
        run: |
          mkdir -p build/Payload
          APP_DIR=$(find build/DerivedData -name "App.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: No App.app found!"
            exit 1
          fi
          echo "Found .app at: $APP_DIR"
          cp -r "$APP_DIR" build/Payload/
          cd build
          zip -qr GiaBao_StudyOS.ipa Payload
          ls -lh GiaBao_StudyOS.ipa
          echo "IPA build completed successfully!"

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiaBao_StudyOS_iOS_Package
          path: build/GiaBao_StudyOS.ipa
          retention-days: 14
