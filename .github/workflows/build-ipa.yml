name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -switch /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj

      - name: Compile iOS App Bundle (Unsigned)
        run: |
          xcodebuild clean build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcode_output.txt

          if grep -q "BUILD FAILED" xcode_output.txt; then
            echo "::error::Xcode build failed!"
            grep -E "(error:|fatal error:)" xcode_output.txt | head -n 10 || true
            exit 1
          fi

      - name: Package Payload into .ipa
        run: |
          mkdir -p build/Payload
          APP_DIR=$(find build/DerivedData -name "App.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: No App.app found in DerivedData!"
            find build/DerivedData -maxdepth 4
            exit 1
          fi
          echo "Found .app at: $APP_DIR"
          ls -la "$APP_DIR"
          cp -r "$APP_DIR" build/Payload/
          cd build
          zip -qr GiaBao_StudyOS.ipa Payload
          ls -lh GiaBao_StudyOS.ipa
          FILE_SIZE=$(stat -f%z GiaBao_StudyOS.ipa 2>/dev/null || stat -c%s GiaBao_StudyOS.ipa 2>/dev/null || echo 0)
          echo "Built IPA size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "ERROR: IPA file too small ($FILE_SIZE bytes), payload might be empty!"
            exit 1
          fi
          echo "IPA build completed successfully!"

      - name: Upload .ipa Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GiaBao_StudyOS_iOS_Package
          path: build/GiaBao_StudyOS.ipa
          retention-days: 14

      - name: Upload Xcode Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode_Log
          path: xcode_output.txt
          if-no-files-found: ignore
