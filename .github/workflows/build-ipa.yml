name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -switch /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj

      - name: Compile iOS App Bundle
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee build.log || {
              echo "=== XCODEBUILD FAILED! DISPLAYING ERRORS ===";
              grep -E "(error:|fatal error:|BUILD FAILED)" build.log -B 2 -A 3 | head -n 80 || tail -n 80 build.log;
              exit 1;
            }

      - name: Package Payload into .ipa
        run: |
          mkdir -p build/Payload
          APP_DIR=$(find build/DerivedData/Build/Products -name "App.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: No .app bundle found in DerivedData!"
            find build/DerivedData -maxdepth 4
            exit 1
          fi
          echo "Found .app at: $APP_DIR"
          ls -la "$APP_DIR"
          cp -r "$APP_DIR" build/Payload/
          cd build
          zip -qr GiaBao_StudyOS.ipa Payload
          ls -lh GiaBao_StudyOS.ipa
          echo "IPA build completed successfully!"

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiaBao_StudyOS_iOS_Package
          path: build/GiaBao_StudyOS.ipa
          retention-days: 14
