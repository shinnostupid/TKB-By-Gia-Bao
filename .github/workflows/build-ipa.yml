name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Build Xcode Archive
        run: |
          xcodebuild clean archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qr GiaBao_StudyOS.ipa Payload
          echo "IPA build completed successfully!"

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiaBao_StudyOS_iOS_Package
          path: build/GiaBao_StudyOS.ipa
          retention-days: 14
